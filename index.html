<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-512.png">
<title>Muerte en el Cumpleaños</title>
<style>
:root{--bg:#0b0f1a;--card:#151b2e;--line:#26304d;--txt:#e8ecf8;--mut:#8f9bbf;--acc:#3ee0ff;--acc2:#ff4d8d;--ok:#5be38a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 50% -20%,#1d2b5a 0,var(--bg) 60%) fixed;color:var(--txt);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1,h2,h3{line-height:1.2;margin:.9em 0 .4em}h1{font-size:1.5em}h2{font-size:1.2em;color:var(--acc)}h3{font-size:1.05em;color:var(--acc2)}
.brand{text-align:center;padding:32px 0 8px}.brand .logo{font-size:56px;filter:drop-shadow(0 0 18px #3ee0ff88)}
.brand h1{margin:.2em 0 0;letter-spacing:.5px}.brand p{color:var(--mut);margin:.2em 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:14px 0;box-shadow:0 8px 30px #0006}
input,select,textarea{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#0e1324;color:var(--txt);font-size:16px;margin:6px 0 12px}
button{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(90deg,var(--acc),#7b6cff);color:#051018;font-weight:700;font-size:16px;cursor:pointer}
button.sec{background:#222b47;color:var(--txt)}button.small{width:auto;padding:8px 14px;font-size:14px}
.err{color:var(--acc2);min-height:1.2em}.mut{color:var(--mut);font-size:.9em}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0b0f1aee;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:none;color:var(--mut);border-radius:0;font-weight:600;font-size:12px;padding:10px 4px}
.tabs button.on{color:var(--acc)}.tabs b{display:block;font-size:20px}
.hdr{display:flex;justify-content:space-between;align-items:center}.hdr small{color:var(--mut)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:#3ee0ff22;color:var(--acc);font-size:.8em;font-weight:700}
blockquote{margin:.6em 0;padding:.5em 1em;border-left:3px solid var(--acc2);background:#ff4d8d12;border-radius:0 10px 10px 0}
table{border-collapse:collapse;width:100%;font-size:.85em;display:block;overflow-x:auto}td,th{border:1px solid var(--line);padding:6px}
details{background:#0e1324;border-radius:12px;padding:10px 14px;margin:10px 0;border:1px solid var(--line)}summary{font-weight:700;cursor:pointer}
.lock{opacity:.5}.row{display:flex;gap:8px}.row>*{flex:1}
.tally{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.hide{display:none}
</style></head><body>

const te=new TextEncoder(), td=new TextDecoder();
async function dec(key,b64){const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
 const base=await crypto.subtle.importKey('raw',te.encode(key),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:raw.slice(0,16),iterations:D.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 return td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(16,28)},k,raw.slice(28)));}
async function tryDec(k,b){try{return await dec(k,b)}catch(e){return null}}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>')}
function md(t){let o='',L=t.split('\n'),i=0;
 while(i<L.length){let l=L[i];
  if(/^\|/.test(l)){let rows=[];while(i<L.length&&/^\|/.test(L[i])){if(!/^\|[-| ]+\|$/.test(L[i]))rows.push(L[i]);i++}
   o+='<table>'+rows.map((r,j)=>'<tr>'+r.slice(1,-1).split('|').map(c=>j?'<td>'+inl(c.trim())+'</td>':'<th>'+inl(c.trim())+'</th>').join('')+'</tr>').join('')+'</table>';continue}
  if(/^- /.test(l)){o+='<ul>';while(i<L.length&&/^- /.test(L[i]))o+='<li>'+inl(L[i++].slice(2))+'</li>';o+='</ul>';continue}
  if(/^\d+\. /.test(l)){o+='<ol>';while(i<L.length&&/^\d+\. /.test(L[i]))o+='<li>'+inl(L[i++].replace(/^\d+\. /,''))+'</li>';o+='</ol>';continue}
  let m=l.match(/^(#{1,3}) (.*)/);if(m)o+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`;
  else if(/^> /.test(l))o+='<blockquote>'+inl(l.slice(2))+'</blockquote>';
  else if(l.trim())o+='<p>'+inl(l)+'</p>';i++}return o}

const codes=()=>LS.get('codes')||{};
async function unlock(code){code=code.trim().toUpperCase();if(!code)return 'Escribe un código';
 for(const r in D.public){const t=await tryDec(code,D.public[r]);if(t){const c=codes();c[r]=code;LS.set('codes',c);return null}}
 return 'Código incorrecto'}

 <div class="err" id="e"></div><button id="go">Entrar</button></div><p class="mut" style="text-align:center">Tu progreso se guarda en este móvil.</p>`;
 $('#go').onclick=async()=>{const u=$('#u').value.trim().toLowerCase(),p=$('#p').value.trim();$('#e').textContent='Comprobando…';
  if(u==='narrador'){const t=await tryDec(p,D.narr);if(!t)return $('#e').textContent='Contraseña incorrecta';S={user:u,pass:p,nar:JSON.parse(t),tab:'guion'};LS.set('sess',[u,p]);return narView()}
  if(!D.users[u])return $('#e').textContent='Usuario no encontrado';
  const t=await tryDec(p,D.users[u].p);if(!t)return $('#e').textContent='Contraseña incorrecta';
  S={user:u,pass:p,prof:JSON.parse(t),tab:'ficha'};LS.set('sess',[u,p]);main()}}

function tabs(list){return '<div class="tabs">'+list.map(([k,ic,n])=>`<button class="${S.tab==k?'on':''}" data-t="${k}"><b>${ic}</b>${n}</button>`).join('')+'</div>'}
function bindTabs(f){document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;f();scrollTo(0,0)})}
const header=()=>`<div class="hdr"><div><span class="pill">${esc(S.prof?S.prof.title:'Narrador')}</span><h1 style="margin:.3em 0 0">${esc(S.prof?S.prof.name:'Narrador 👻')}</h1></div><button class="small sec" id="out">Salir</button></div>`;
function bindOut(){$('#out').onclick=()=>{LS.set('sess',null);S={};loginView()}}
const codeBox=()=>`<div class="card"><b>🔓 Desbloquear ronda</b><p class="mut">El narrador dirá el código en voz alta.</p><div class="row"><input id="code" placeholder="CÓDIGO" autocapitalize="characters"><button id="ub" class="small">Abrir</button></div><div class="err" id="ce"></div></div>`;
function bindCode(after){$('#ub').onclick=async()=>{$('#ce').textContent='…';const e=await unlock($('#code').value);$('#ce').textContent=e||'';if(!e)after()}}

async function main(){const c=codes(),u=D.users[S.user];let h=header();
 if(S.tab==='ficha'){h+=`<div class="card"><h2>Tu personaje</h2>${md(S.prof.public)}</div>`;
  if(!c[1])h+=`<div class="card lock"><h3>🔒 Ficha secreta</h3><p>Se desbloquea al comienzo de la fiesta.</p></div>`+codeBox();
  for(let r=1;r<=4;r++)if(c[r]){const t=await dec(S.pass+'|'+c[r],u.r[r]);h+=`<details ${r==Math.max(...Object.keys(c).filter(x=>x<=4).map(Number))?'open':''}><summary>${r==1?'🕵️ Ficha secreta':'🧩 Información privada · Ronda '+r}</summary>${md(t)}</details>`}
  if(c[1])h+=codeBox()}
 else if(S.tab==='rondas'){h+=codeBox();let any=0;for(let r=6;r>=1;r--)if(c[r]&&r!=5){any=1;h+=`<div class="card">${md(await dec(c[r],D.public[r]))}</div>`}
  if(!any)h+=`<p class="mut">Aún no hay rondas abiertas.</p>`}
 else if(S.tab==='notas'){h+=`<div class="card"><h2>📝 Mis notas</h2><p class="mut">Solo las ves tú.</p><textarea id="nt" rows="14">${esc(LS.get('notes_'+S.user)||'')}</textarea></div>`}
 else if(S.tab==='votar'){if(!c[5])h+=`<div class="card lock"><h2>🗳️ Votación</h2><p>Se abre al final de la partida.</p></div>`+codeBox();
  else{const v=LS.get('vote_'+S.user);h+=`<div class="card">${md(await dec(c[5],D.public[5]))}`;
   if(v)h+=`<p>✅ Ya has votado a <b>${esc(v)}</b>.</p><button class="sec" id="resend">Reenviar por WhatsApp</button>`;
   else h+=`<label>¿Quién es K-7?</label><select id="vs"><option value="">— Elige —</option>${D.cands.map(n=>`<option>${n}</option>`).join('')}</select><label>Motivo (opcional)</label><textarea id="vm" rows="3"></textarea><div class="err" id="ve"></div><button id="vb">Enviar voto</button>`;
   h+='</div>'}}
 app.innerHTML=h+tabs([['ficha','🎭','Personaje'],['rondas','📜','Rondas'],['notas','📝','Notas'],['votar','🗳️','Votar']]);
 bindTabs(main);bindOut();if($('#ub'))bindCode(main);
 if($('#nt'))$('#nt').oninput=e=>LS.set('notes_'+S.user,e.target.value);
 if($('#vb'))$('#vb').onclick=()=>sendVote($('#vs').value,$('#vm').value);
 if($('#resend'))$('#resend').onclick=()=>wa(voteText(LS.get('vote_'+S.user),''))}
const voteText=(who,why)=>`🗳️ VOTO de ${S.prof.name}: acusa a ${who}${why?'\nMotivo: '+why:''}`;
function wa(t){location.href='https://wa.me/?text='+encodeURIComponent(t)}
async function sendVote(who,why){if(!who)return $('#ve').textContent='Elige a alguien';
 if(!confirm('¿Votar a '+who+'? No se puede cambiar.'))return;const t=voteText(who,why);let ok=false;
 if(TG_TOKEN&&TG_CHAT){try{await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'chat_id='+encodeURIComponent(TG_CHAT)+'&text='+encodeURIComponent(t)});ok=true}catch(e){}}
 LS.set('vote_'+S.user,who);
 if(ok)alert('Voto enviado al narrador ✅');else if(confirm('No se pudo enviar por Telegram. ¿Enviarlo por WhatsApp al narrador?'))wa(t);main()}

function narView(){const n=S.nar;let h=header();
 if(S.tab==='guion')h+=`<div class="card">${md(n.md)}</div>`;
 else if(S.tab==='codigos')h+=`<div class="card"><h2>Códigos de ronda</h2>${Object.entries(n.codes).map(([r,c])=>`<div class="tally"><span>${['','Ronda 1','Ronda 2','Ronda 3','Ronda 4','Votación','Verdad'][r]}</span><b style="font-size:1.4em;color:var(--acc)">${c}</b></div>`).join('')}</div>`;
 else{const t=LS.get('tally')||{};h+=`<div class="card"><h2>Contador de votos</h2><p class="mut">Toca + o − según te lleguen los votos.</p>${D.cands.map(c=>`<div class="tally"><span>${c}</span><span><button class="small sec" data-m="${c}">−</button> <b style="display:inline-block;width:28px;text-align:center">${t[c]||0}</b> <button class="small" data-p="${c}">+</button></span></div>`).join('')}<br><button class="sec" id="rst">Poner a cero</button></div>`}
 app.innerHTML=h+tabs([['guion','📖','Guion'],['codigos','🔑','Códigos'],['votos','🧮','Votos']]);bindTabs(narView);bindOut();
 document.querySelectorAll('[data-p],[data-m]').forEach(b=>b.onclick=()=>{const t=LS.get('tally')||{},k=b.dataset.p||b.dataset.m;t[k]=Math.max(0,(t[k]||0)+(b.dataset.p?1:-1));LS.set('tally',t);narView()});
 if($('#rst'))$('#rst').onclick=()=>{if(confirm('¿Seguro?')){LS.set('tally',{});narView()}}}

(async()=>{if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 const s=LS.get('sess');if(s){const[u,p]=s;
  if(u==='narrador'){const t=await tryDec(p,D.narr);if(t){S={user:u,pass:p,nar:JSON.parse(t),tab:'guion'};return narView()}}
  else if(D.users[u]){const t=await tryDec(p,D.users[u].p);if(t){S={user:u,pass:p,prof:JSON.parse(t),tab:'ficha'};return main()}}}
 loginView()})();
</script></body></html>
