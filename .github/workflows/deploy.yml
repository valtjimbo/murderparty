name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch: # Permite ejecutar el workflow manualmente

# Permisos necesarios para que GitHub Actions pueda publicar la web
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Inyectar Secrets en el HTML
        run: |
          sed -i 's/SECRET_TG_TOKEN/${{ secrets.TG_TOKEN }}/g' index.html
          sed -i 's/SECRET_TG_CHAT/${{ secrets.TG_CHAT }}/g' index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar los archivos de la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Sube todos los archivos (index, icon, manifest)

      - name: Desplegar la web
        id: deployment
        uses: actions/deploy-pages@v4
